version: '3.8'

services:
  # Database Service
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nilesh
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nilesh -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot Application Service
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Overriding defaults to match the db service
      - DB_HOST=db
      - DB_USER=nilesh
      - DB_PASSWORD=securepassword
      - DB_NAME=sentinel
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
