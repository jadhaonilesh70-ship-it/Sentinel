# 12-Factor App: Store config in the environment
# Defaults are provided for local development if environment variables are missing
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:sentinel}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

# Expose Actuator metrics for Observability
management.endpoints.web.exposure.include=health,metrics
